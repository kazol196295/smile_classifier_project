services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smile_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - YSDTP_B5_AI_YourID
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/smile_db
    ports:
      - "8000:8000"
    networks:
      - YSDTP_B5_AI_YourID
    volumes:
      - ./model:/app/model
      - ./static/uploaded_images:/app/static/uploaded_images
    restart: unless-stopped

volumes:
  pgdata:

networks:
  YSDTP_B5_AI_YourID:
    driver: bridge
