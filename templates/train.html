{% extends "base.html" %}
{% block content %}
<div class="card">
    <div style="text-align: center; margin-bottom: 2rem;">
        <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">Train</div>
        <h2 style="font-size: 1.5rem; font-weight: 600;">Train Your Model</h2>
    </div>

    {% if success %}
    <div class="success">
        Accuracy: {{ accuracy }}% — {{ total_count }} images processed
    </div>
    {% endif %}

    {% if error %}
    <div class="error">{{ message }}</div>
    {% endif %}

    <form action="/train" method="post" enctype="multipart/form-data" id="trainForm">
        <div class="form-group">
            <label>Smile Images Folder</label>
            <input type="file" name="smile_folder" id="smile_folder" webkitdirectory multiple required>
            <div id="smile_count" style="font-size: 0.85rem; color: #667eea; margin-top: 8px; font-weight: 600;"></div>
        </div>
        <div class="form-group">
            <label>Non-Smile Images Folder</label>
            <input type="file" name="non_smile_folder" id="non_smile_folder" webkitdirectory multiple required>
            <div id="non_smile_count" style="font-size: 0.85rem; color: #667eea; margin-top: 8px; font-weight: 600;"></div>
        </div>
        <div style="text-align: center;">
            <button type="submit" class="btn" id="trainBtn">Start Training</button>
        </div>
    </form>
</div>

<script>
function updateFileCount(inputId, displayId) {
    const input = document.getElementById(inputId);
    const display = document.getElementById(displayId);
    input.addEventListener('change', function() {
        display.textContent = this.files.length > 0 ? `${this.files.length} files selected` : '';
    });
}
updateFileCount('smile_folder', 'smile_count');
updateFileCount('non_smile_folder', 'non_smile_count');
document.getElementById('trainForm').addEventListener('submit', function() {
    var btn = document.getElementById('trainBtn');
    btn.disabled = true;
    btn.textContent = 'Training...';
});
</script>
{% endblock %}
