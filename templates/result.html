{% extends "base.html" %}
{% block content %}
<div class="card result-card">
    <img src="/static/uploaded_images/{{ result.image_path.split('/')[-1] }}" 
         alt="Uploaded image" 
         style="width: 280px; height: 280px; object-fit: cover; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);">

    <div class="class-label">{{ result.predicted_class }}</div>
    <div class="confidence">{{ "%.0f"|format(result.confidence * 100) }}% confident</div>

    <div style="margin-top: 2rem; display: flex; gap: 1rem; justify-content: center;">
        <a href="/classify" class="btn">Classify More</a>
        <a href="/history" class="btn btn-ghost">History</a>
    </div>
</div>
{% endblock %}
