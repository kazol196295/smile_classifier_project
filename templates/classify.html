{% extends "base.html" %}
{% block content %}
<div class="card">
    <div style="text-align: center; margin-bottom: 2rem;">
        <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">Upload</div>
        <h2 style="font-size: 1.5rem; font-weight: 600;">Classify Images</h2>
    </div>

    <form action="/classify" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <input type="file" name="files" id="files" accept="image/*" multiple required>
        </div>
        <div style="text-align: center;">
            <button type="submit" class="btn">Classify</button>
        </div>
    </form>
</div>
{% endblock %}
