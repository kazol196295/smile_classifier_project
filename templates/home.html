{% extends "base.html" %}
{% block content %}
<div class="card" style="text-align: center; padding: 3rem 2.5rem;">
    <div style="font-size: 4rem; margin-bottom: 1rem;">Smile</div>
    <h1 style="font-size: 2.2rem; font-weight: 700; margin-bottom: 0.5rem; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
        AI-Powered Smile Detection
    </h1>
    <p style="color: #6b7280; font-size: 1.1rem; margin-bottom: 2.5rem; max-width: 500px; margin-left: auto; margin-right: auto;">
        Upload a photo. Get instant results.
    </p>

    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <a href="/classify" class="btn">Classify Now</a>
        <a href="/train" class="btn btn-ghost">Train Model</a>
        <a href="/history" class="btn btn-ghost">History</a>
    </div>
</div>
{% endblock %}
