{% extends "base.html" %}
{% block content %}
<div class="card">
    <div style="text-align: center; margin-bottom: 2rem;">
        <h2 style="font-size: 1.5rem; font-weight: 600;">{{ results|length }} Images Classified</h2>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.2rem;">
        {% for result in results %}
        <div style="background: #f9fafb; border-radius: 16px; padding: 1rem; text-align: center; transition: transform 0.3s ease;" 
             onmouseover="this.style.transform='translateY(-4px)'" 
             onmouseout="this.style.transform='none'">
            <img src="/static/uploaded_images/{{ result.image_path.split('/')[-1] }}" 
                 alt="Image" 
                 style="width: 100%; height: 160px; object-fit: cover; border-radius: 12px; margin-bottom: 1rem;">
            <div style="font-size: 1.1rem; font-weight: 600; color: #1e1b4b;">{{ result.predicted_class }}</div>
            <div style="font-size: 0.85rem; color: #6b7280;">{{ "%.0f"|format(result.confidence * 100) }}%</div>
        </div>
        {% endfor %}
    </div>

    <div style="margin-top: 2rem; text-align: center;">
        <a href="/classify" class="btn">Classify More</a>
    </div>
</div>
{% endblock %}
